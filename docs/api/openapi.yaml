openapi: 3.0.3
info:
  title: Project All Star API
  version: 0.1.0
  description: |
    Contract for the white-label visibility tool (owner, coach, customer).
    Contract-first: Backend and Frontend build in parallel against this file.

    Conventions
    - Every resource belongs to one tenant. The tenant is resolved from the
      session token (authenticated routes) or the `tenantSlug` (public routes).
      Clients never send tenant_id for scoping; the server enforces it.
    - Roles: `owner`, `coach`, `customer` (customer covers members and parents).
      Roles are enforced on the server. Each operation lists its allowed roles
      in `x-roles`. A customer only ever sees their own (or their linked
      child's) data; a coach only sees their own batches and sessions.
    - Auth: `Authorization: Bearer <accessToken>`.
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - Lists are cursor-paginated: `?limit=` (default 25, max 100) and `?cursor=`.
    - All ids are opaque strings. Timestamps are ISO-8601 UTC; dates are
      `YYYY-MM-DD` in the tenant timezone.
    - All data in demo environments is seed or fake data.
    - Wording: this is a visibility tool. Field and endpoint names describe
      sessions, attendance and progress.
    - Auth method (OTP and magic link) follows CLAUDE.md; details are
      Proposed and subject to a human decision in Decisions & Docs.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tenants
  - name: Members
  - name: Batches
  - name: Sessions
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a one-time code to a phone number
      description: Used by all roles. In the POC the code is shown in the dev log and is fixed in seed mode.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Sign in with phone and one-time code
      description: Also verifies a parent account on first sign-in.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/magic-link/exchange:
    post:
      tags: [Auth]
      operationId: exchangeMagicLink
      summary: Exchange a shared magic-link token for a session
      description: WhatsApp-first sign-in for customers and parents. The link is generated by the owner or coach and shared by hand in the POC.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      x-roles: [owner, coach, customer]
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, role and tenant
      x-roles: [owner, coach, customer]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tenants/{tenantSlug}/theme:
    get:
      tags: [Tenants]
      operationId: getTenantTheme
      summary: Public white-label theme for a tenant
      description: |
        Public so the sign-in page can be themed before login. Contains only
        the business's own name, logo and colors; no builder branding.
      x-roles: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTheme'
        '404': {$ref: '#/components/responses/NotFound'}
  /tenant:
    get:
      tags: [Tenants]
      operationId: getCurrentTenant
      summary: Current tenant profile and settings
      x-roles: [owner, coach, customer]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tenant/theme:
    put:
      tags: [Tenants]
      operationId: updateTenantTheme
      summary: Update the tenant's name, logo and colors
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantThemeInput'
      responses:
        '200':
          description: Updated theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTheme'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: |
        Owner sees all members. Coach sees members in their own batches.
        Customer is not allowed (use `/me` and `/members/{memberId}` for self).
      x-roles: [owner, coach]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Search by name or phone
          schema: {type: string}
        - name: batchId
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/MemberStatus'}
      responses:
        '200':
          description: Page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/{memberId}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Member detail with progress and attendance summary
      description: Owner any member; coach members in their batches; customer only self or linked child.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/import:
    post:
      tags: [Members]
      operationId: importMembersCsv
      summary: Validate or commit a CSV import of members
      description: |
        Upload a CSV (UTF-8) with columns: name, phone, email, guardian_name,
        guardian_phone, batch_name, sport, level, goal, join_date
        (YYYY-MM-DD), fee_status (paid|due|overdue). With `dryRun=true`
        nothing is saved and a preview plus row errors are returned. With
        `dryRun=false` rows are saved only if there are no row errors
        (all or nothing).
      x-roles: [owner]
      parameters:
        - name: dryRun
          in: query
          schema: {type: boolean, default: true}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: File too large
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /batches:
    get:
      tags: [Batches]
      operationId: listBatches
      summary: List batches (a recurring group of members, e.g. a class or cohort)
      description: Owner all; coach own batches; customer batches their member (or child) belongs to.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: venueId
          in: query
          schema: {type: string}
        - name: sportId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Page of batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List scheduled and completed sessions
      description: Owner all; coach own sessions; customer sessions of their own (or child's) batches.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: batchId
          in: query
          schema: {type: string}
        - name: coachId
          in: query
          description: Ignored for coach role (forced to self)
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SessionStatus'}
      responses:
        '200':
          description: Page of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema: {type: string, example: karate-academy}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Role not allowed or resource outside the caller's own view
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (also returned for resources in another tenant)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              example: validation_failed
              enum: [validation_failed, unauthorized, forbidden, not_found, rate_limited, payload_too_large, internal_error]
            message:
              type: string
              description: Human-readable, English
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string}
                  message: {type: string}
            requestId: {type: string}
    Role:
      type: string
      enum: [owner, coach, customer]
    Locale:
      type: string
      enum: [en, hi, kn]
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      example: '#1F6FEB'
    OtpRequest:
      type: object
      required: [tenantSlug, phone]
      properties:
        tenantSlug: {type: string}
        phone: {type: string, description: 'E.164, e.g. +919000000001'}
    OtpRequested:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: {type: integer, example: 300}
    OtpVerify:
      type: object
      required: [tenantSlug, phone, code]
      properties:
        tenantSlug: {type: string}
        phone: {type: string}
        code: {type: string, example: '123456'}
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresInSeconds: {type: integer}
    SignInResult:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/Me'}
    Me:
      type: object
      required: [id, role, name, tenantId, tenantSlug]
      properties:
        id: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        name: {type: string}
        phone: {type: string}
        tenantId: {type: string}
        tenantSlug: {type: string}
        memberIds:
          type: array
          description: For customers, the member profiles they may view (self and linked children)
          items: {type: string}
        coachId:
          type: string
          nullable: true
        locale: {$ref: '#/components/schemas/Locale'}
    TenantTheme:
      type: object
      required: [tenantSlug, displayName, primaryColor, secondaryColor]
      properties:
        tenantSlug: {type: string}
        displayName: {type: string, example: Demo Karate Academy}
        logoUrl: {type: string, format: uri, nullable: true}
        primaryColor: {$ref: '#/components/schemas/HexColor'}
        secondaryColor: {$ref: '#/components/schemas/HexColor'}
        accentColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true}
        defaultLocale: {$ref: '#/components/schemas/Locale'}
    TenantThemeInput:
      type: object
      required: [displayName, primaryColor, secondaryColor]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        logoUrl: {type: string, format: uri, nullable: true}
        primaryColor: {$ref: '#/components/schemas/HexColor'}
        secondaryColor: {$ref: '#/components/schemas/HexColor'}
        accentColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true}
        defaultLocale: {$ref: '#/components/schemas/Locale'}
    Tenant:
      type: object
      required: [id, slug, theme, timezone]
      properties:
        id: {type: string}
        slug: {type: string}
        timezone: {type: string, example: Asia/Kolkata}
        theme: {$ref: '#/components/schemas/TenantTheme'}
        showMissedSessionCost:
          type: boolean
          default: false
          description: Per-tenant display toggle, off by default
    MemberStatus:
      type: string
      enum: [active, paused, ended]
    FeeStatus:
      type: string
      description: Display only; marked by hand
      enum: [paid, due, overdue]
    MemberSummary:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string}
        name: {type: string}
        status: {$ref: '#/components/schemas/MemberStatus'}
        batchIds:
          type: array
          items: {type: string}
        sportId: {type: string, nullable: true}
        level: {type: string, nullable: true, example: Yellow belt}
        feeStatus: {$ref: '#/components/schemas/FeeStatus'}
        attendancePercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
    MemberSessionEntry:
      type: object
      required: [sessionId, date, attendance]
      properties:
        sessionId: {type: string}
        date: {type: string, format: date}
        attendance:
          type: string
          enum: [present, absent, excused, not_marked]
        excusedReason:
          type: string
          nullable: true
          enum: [exam, illness, festival, travel]
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            phone: {type: string, nullable: true}
            guardianName: {type: string, nullable: true}
            joinDate: {type: string, format: date}
            goal: {type: string, nullable: true}
            progressPercent:
              type: number
              minimum: 0
              maximum: 100
              description: Level or belt progress; a missed class extends the timeline except excused absences and holidays
            attendance:
              type: object
              properties:
                attended: {type: integer}
                missed: {type: integer}
                excused: {type: integer}
                scheduled: {type: integer}
            recentSessions:
              type: array
              items: {$ref: '#/components/schemas/MemberSessionEntry'}
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MemberSummary'}
        nextCursor: {type: string, nullable: true}
    ImportResult:
      type: object
      required: [dryRun, totalRows, validRows, errors]
      properties:
        dryRun: {type: boolean}
        totalRows: {type: integer}
        validRows: {type: integer}
        importedRows:
          type: integer
          description: Present only when dryRun is false and import succeeded
        preview:
          type: array
          description: First rows as parsed (max 20)
          items:
            type: object
            additionalProperties: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row: {type: integer, description: '1-based data row (header excluded)'}
              column: {type: string, nullable: true}
              message: {type: string}
    Batch:
      type: object
      required: [id, name, sportId, venueId, coachIds]
      properties:
        id: {type: string}
        name: {type: string, example: Evening beginners}
        sportId: {type: string}
        sportName: {type: string}
        venueId: {type: string}
        venueName: {type: string}
        coachIds:
          type: array
          items: {type: string}
        isGroupClass: {type: boolean}
        capacity: {type: integer, nullable: true}
        memberCount: {type: integer}
        schedule:
          type: array
          items:
            type: object
            required: [weekday, startTime, endTime]
            properties:
              weekday: {type: integer, minimum: 1, maximum: 7, description: '1 = Monday'}
              startTime: {type: string, example: '18:00'}
              endTime: {type: string, example: '19:00'}
    BatchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
        nextCursor: {type: string, nullable: true}
    SessionStatus:
      type: string
      enum: [scheduled, completed, cancelled]
    Session:
      type: object
      required: [id, batchId, coachId, startsAt, endsAt, status]
      properties:
        id: {type: string}
        batchId: {type: string}
        batchName: {type: string}
        coachId: {type: string}
        coachName: {type: string}
        venueId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/SessionStatus'}
        attendanceSummary:
          type: object
          description: Present once roll call is logged
          nullable: true
          properties:
            present: {type: integer}
            absent: {type: integer}
            excused: {type: integer}
            total: {type: integer}
        coachNote: {type: string, nullable: true}
    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Session'}
        nextCursor: {type: string, nullable: true}
