openapi: 3.0.3
info:
  title: Project All Star API
  version: 0.3.0
  description: |
    Contract for the white-label visibility tool (owner, coach, customer).
    Contract-first: Backend and Frontend build in parallel against this file.

    Conventions
    - Every resource belongs to one tenant. The tenant is resolved from the
      session token (authenticated routes) or the `tenantSlug` (public routes).
      Clients never send tenant_id for scoping; the server enforces it.
    - Roles: `owner`, `coach`, `customer` (customer covers members and parents).
      Roles are enforced on the server. Each operation lists its allowed roles
      in `x-roles`. A customer only ever sees their own (or their linked
      child's) data; a coach only sees their own batches and sessions.
    - Auth: `Authorization: Bearer <accessToken>`.
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - Lists are cursor-paginated: `?limit=` (default 25, max 100) and `?cursor=`.
    - All ids are opaque strings. Timestamps are ISO-8601 UTC; dates are
      `YYYY-MM-DD` in the tenant timezone.
    - All data in demo environments is seed or fake data.
    - Wording: this is a visibility tool. Field and endpoint names describe
      sessions, attendance and progress.
    - Auth method (OTP and magic link) follows CLAUDE.md; details are
      Proposed and subject to a human decision in Decisions & Docs.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Tenants
  - name: Members
  - name: Batches
  - name: Venues
  - name: Sessions
  - name: Exercises
  - name: Workouts
  - name: Coaches
  - name: Analytics
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a one-time code to a phone number
      description: Used by all roles. In the POC the code is shown in the dev log and is fixed in seed mode.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Sign in with phone and one-time code
      description: Also verifies a parent account on first sign-in.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/magic-link/exchange:
    post:
      tags: [Auth]
      operationId: exchangeMagicLink
      summary: Exchange a shared magic-link token for a session
      description: WhatsApp-first sign-in for customers and parents. The link is generated by the owner or coach and shared by hand in the POC.
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      x-roles: [owner, coach, customer]
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, role and tenant
      x-roles: [owner, coach, customer]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tenants/{tenantSlug}/theme:
    get:
      tags: [Tenants]
      operationId: getTenantTheme
      summary: Public white-label theme for a tenant
      description: |
        Public so the sign-in page can be themed before login. Contains only
        the business's own name, logo and colors; no builder branding.
      x-roles: [public]
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTheme'
        '404': {$ref: '#/components/responses/NotFound'}
  /tenant:
    get:
      tags: [Tenants]
      operationId: getCurrentTenant
      summary: Current tenant profile and settings
      x-roles: [owner, coach, customer]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /tenant/theme:
    put:
      tags: [Tenants]
      operationId: updateTenantTheme
      summary: Update the tenant's name, logo and colors
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantThemeInput'
      responses:
        '200':
          description: Updated theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTheme'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members
      description: |
        Owner sees all members. Coach sees members in their own batches.
        Customer is not allowed (use `/me` and `/members/{memberId}` for self).
      x-roles: [owner, coach]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Search by name or phone
          schema: {type: string}
        - name: batchId
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/MemberStatus'}
      responses:
        '200':
          description: Page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/{memberId}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Member detail with progress and attendance summary
      description: Owner any member; coach members in their batches; customer only self or linked child.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/magic-link:
    post:
      tags: [Members]
      operationId: createMemberMagicLink
      summary: Generate a shareable single-use sign-in link for a member or their parent
      description: |
        Owner for any member of the tenant; coach only for members in their own batches (403 otherwise);
        customers are denied (403). The link signs in the member's own login (adults) or the
        parent/guardian's login (kids). Single use, expires after 15 minutes; only a hash of the token is
        stored, so the URL is shown once and cannot be retrieved again. The URL is built from the server's
        APP_BASE_URL as `/auth/magic?token=...`; the page there calls `exchangeMagicLink`. Delivery stays
        manual (the owner or coach copies and shares it); nothing is sent over WhatsApp or SMS.
        404 when the member is not in the caller's tenant or has no linked login.
      x-roles: [owner, coach]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberMagicLink'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/import:
    post:
      tags: [Members]
      operationId: importMembersCsv
      summary: Validate or commit a CSV import of members
      description: |
        Upload a CSV (UTF-8) with columns: name, phone, email, guardian_name,
        guardian_phone, batch_name, sport, level, goal, join_date
        (YYYY-MM-DD), fee_status (paid|due|overdue). With `dryRun=true`
        nothing is saved and a preview plus row errors are returned. With
        `dryRun=false` rows are saved only if there are no row errors
        (all or nothing). Only `name` is required; every other column is
        optional. A row whose name and contact phone (own phone for adults,
        guardian phone for children) already exist in the caller's tenant is
        skipped, so re-uploading the same file creates no duplicates. The same
        member twice in one file is a row error. batch_name, sport and level
        are linked only when they already exist; otherwise the row is still
        imported and a warning is returned. Excel and PDF are not supported
        (400); CSV only, up to 2 MB and 2000 rows. Members always go into the
        caller's tenant.
      x-roles: [owner]
      parameters:
        - name: dryRun
          in: query
          schema: {type: boolean, default: true}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: File too large
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /batches:
    get:
      tags: [Batches]
      operationId: listBatches
      summary: List batches (a recurring group of members, e.g. a class or cohort)
      description: Owner all; coach own batches; customer batches their member (or child) belongs to.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: venueId
          in: query
          schema: {type: string}
        - name: sportId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Page of batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: List venues (the places where batches run)
      description: Owner all; coach and customer only venues of batches they can see (their own).
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of venues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuePage'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List scheduled and completed sessions
      description: Owner all; coach own sessions; customer sessions of their own (or child's) batches.
      x-roles: [owner, coach, customer]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: batchId
          in: query
          schema: {type: string}
        - name: coachId
          in: query
          description: Ignored for coach role (forced to self)
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SessionStatus'}
      responses:
        '200':
          description: Page of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Sessions]
      operationId: createSession
      x-roles: [owner, coach]
      summary: Schedule a training session (extra group-class session or one-on-one with a member)
      description: |
        Give `batchId` for a session of an existing batch, or `memberId` for a
        one-on-one: the server reuses (or creates) the coach's ONE_ON_ONE batch for that
        member. Coach only for own batches or members in own batches; `coachId` is forced
        to self for coaches (owner may pick any coach). Warns (not blocks) when outside
        the coach's availability; 409 conflict when it overlaps another scheduled session
        of the same coach. Writes `session_scheduled` updates for one-on-one members.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionInput'}
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  # ---------------------------------------------------------------------------
  # Sprint 2 (POC completion). See docs/PLAN-POC.md for the data model, the
  # row-level rules behind each x-roles entry and the analytics formulas.
  # ---------------------------------------------------------------------------
  /tenant/settings:
    put:
      tags: [Tenants]
      operationId: updateTenantSettings
      x-roles: [owner]
      summary: Update per-tenant settings (booking cancellation window, waitlist, missed-session cost display)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantSettingsInput'}
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /exercises:
    get:
      tags: [Exercises]
      operationId: listExercises
      x-roles: [owner, coach, customer]
      summary: Search the tenant's exercise catalog (used by the plan builder picker)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: q, in: query, description: Name contains (case-insensitive), schema: {type: string}}
        - {name: sport, in: query, description: Sport slug, schema: {type: string}}
        - {name: muscle, in: query, schema: {type: string}}
        - {name: equipment, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string}}
      responses:
        '200':
          description: Page of exercises
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExercisePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /exercises/{exerciseId}:
    get:
      tags: [Exercises]
      operationId: getExercise
      x-roles: [owner, coach, customer]
      summary: Exercise detail (instructions, muscles, equipment)
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: Exercise
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Exercise'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /coaches:
    get:
      tags: [Coaches]
      operationId: listCoaches
      x-roles: [owner]
      summary: Coaches of the tenant with a short workload summary (Coach Insight Directory)
      responses:
        '200':
          description: Coaches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CoachSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /coaches/{coachId}/stats:
    get:
      tags: [Coaches]
      operationId: getCoachStats
      x-roles: [owner, coach]
      summary: A coach's record (sessions delivered, consistency, member outcomes). Coach only for self.
      parameters:
        - $ref: '#/components/parameters/CoachId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Coach stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachStats'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /coaches/{coachId}/availability:
    get:
      tags: [Coaches]
      operationId: listCoachAvailability
      x-roles: [owner, coach]
      summary: Weekly availability slots of a coach. Coach only for self.
      parameters:
        - $ref: '#/components/parameters/CoachId'
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachAvailability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Coaches]
      operationId: replaceCoachAvailability
      x-roles: [owner, coach]
      summary: Replace all weekly availability slots of a coach. Coach only for self.
      description: Slots must not overlap on the same weekday (400 validation_failed with details).
      parameters:
        - $ref: '#/components/parameters/CoachId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoachAvailabilityInput'}
      responses:
        '200':
          description: Saved availability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachAvailability'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /coaches/{coachId}/credentials:
    get:
      tags: [Coaches]
      operationId: listCoachCredentials
      x-roles: [owner, coach, customer]
      summary: Credential badges of a coach (verified or unverified). Coach only for self; a customer only for coaches who teach their members.
      parameters:
        - $ref: '#/components/parameters/CoachId'
      responses:
        '200':
          description: Credentials, oldest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachCredentialList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Coaches]
      operationId: createCoachCredential
      x-roles: [owner, coach]
      summary: Add a claimed credential to a coach (coach only for self). It starts unverified until the owner verifies it.
      parameters:
        - $ref: '#/components/parameters/CoachId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoachCredentialInput'}
      responses:
        '201':
          description: Created credential (unverified)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /coach-credentials/{credentialId}:
    patch:
      tags: [Coaches]
      operationId: setCoachCredentialVerification
      x-roles: [owner]
      summary: Owner marks a credential verified or unverified
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CoachCredentialVerification'}
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoachCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Coaches]
      operationId: deleteCoachCredential
      x-roles: [owner, coach]
      summary: Remove a credential (owner any; coach only their own)
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workout-plans:
    get:
      tags: [Workouts]
      operationId: listWorkoutPlans
      x-roles: [owner, coach]
      summary: List workout plans. Owner all; coach only plans they created.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/PlanStatus'}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        '200':
          description: Page of plans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPlanPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Workouts]
      operationId: createWorkoutPlan
      x-roles: [owner, coach]
      summary: Create a workout plan (daily, weekly or monthly routine) from catalog exercises
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutPlanInput'}
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPlan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workout-plans/{planId}:
    get:
      tags: [Workouts]
      operationId: getWorkoutPlan
      x-roles: [owner, coach, customer]
      summary: Plan with days and items. Coach own plans; customer only plans assigned to self or child.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPlan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Workouts]
      operationId: updateWorkoutPlan
      x-roles: [owner, coach]
      summary: Replace a plan's title, cadence, days and items
      description: |
        Full replace. Increments `version`. Items that already have workout logs are
        archived (kept for history) instead of removed. Writes a `plan_updated` member
        update for every member with an active assignment of this plan, so customers
        see the change. 409 conflict when `expectedVersion` does not match.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WorkoutPlanInput'
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: {type: integer, minimum: 1}
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPlan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workout-plans/{planId}/archive:
    post:
      tags: [Workouts]
      operationId: archiveWorkoutPlan
      x-roles: [owner, coach]
      summary: Archive a plan (never deleted). Ends its active assignments and notifies those members.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Archived plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPlan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /plan-assignments:
    get:
      tags: [Workouts]
      operationId: listPlanAssignments
      x-roles: [owner, coach, customer]
      summary: List plan assignments. Owner all; coach assignments to members in own batches or of own plans; customer self or child.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: memberId, in: query, schema: {type: string}}
        - {name: planId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AssignmentStatus'}}
      responses:
        '200':
          description: Page of assignments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAssignmentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Workouts]
      operationId: createPlanAssignments
      x-roles: [owner, coach]
      summary: Assign a plan to one or more members
      description: |
        Coach may assign only to members in their own batches (403 otherwise) and only
        plans they can see. A member may hold several active assignments of different
        plans; assigning the same plan twice while active is 409 conflict. Writes a
        `plan_assigned` member update per member. All or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanAssignmentInput'}
      responses:
        '201':
          description: Created assignments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PlanAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /plan-assignments/{assignmentId}:
    patch:
      tags: [Workouts]
      operationId: updatePlanAssignment
      x-roles: [owner, coach]
      summary: Pause, resume, end or change the dates of an assignment
      description: Writes a `plan_updated` (or `plan_ended`) member update.
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanAssignmentPatch'}
      responses:
        '200':
          description: Updated assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/schedule:
    get:
      tags: [Members]
      operationId: getMemberSchedule
      x-roles: [owner, coach, customer]
      summary: Day-by-day schedule for a member (assigned workout items and sessions)
      description: |
        Expands active assignments into dated items (see docs/PLAN-POC.md "Schedule
        expansion") and merges the member's sessions and bookings. Range max 62 days;
        default today .. today+6 in the tenant timezone. Same visibility as getMember.
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberSchedule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/workout-logs:
    get:
      tags: [Members]
      operationId: listWorkoutLogs
      x-roles: [owner, coach, customer]
      summary: Workout history for a member (started, stopped, completed, skipped items)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of logs, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutLogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workout-logs:
    put:
      tags: [Workouts]
      operationId: recordWorkoutLog
      x-roles: [coach, customer]
      summary: Start, stop, complete or skip an assigned workout item (idempotent by clientId)
      description: |
        Customer only for self or child; coach only for members in own batches.
        Upsert by (assignmentId, planItemId, scheduledFor); `clientId` makes offline
        retries idempotent. `scheduledFor` must be a date on which the item is scheduled
        (400 otherwise) and not in the future. Transitions: none -> started|completed|skipped,
        started -> stopped|completed, stopped -> started|completed. Completed is final
        except the same action repeated (idempotent 200).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutLogInput'}
      responses:
        '200':
          description: Saved log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutLog'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /members/{memberId}/stats:
    get:
      tags: [Members]
      operationId: getMemberStats
      x-roles: [owner, coach, customer]
      summary: Member stats (attendance, workouts completed vs pending, streaks, weekly series, goals)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberStats'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/goals:
    get:
      tags: [Members]
      operationId: listGoals
      x-roles: [owner, coach, customer]
      summary: Goals of a member with computed progress
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/GoalStatus'}}
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Goal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Members]
      operationId: createGoal
      x-roles: [owner, coach]
      summary: Set a goal for a member. Coach only for members in own batches. Writes a `goal_set` update.
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalInput'}
      responses:
        '201':
          description: Created goal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Goal'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /goals/{goalId}:
    patch:
      tags: [Members]
      operationId: updateGoal
      x-roles: [owner, coach]
      summary: Edit a goal or change its status (active, achieved, dropped). Writes a `goal_updated` update.
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalPatch'}
      responses:
        '200':
          description: Updated goal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Goal'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /goals/{goalId}/check-ins:
    post:
      tags: [Members]
      operationId: addGoalCheckIn
      x-roles: [owner, coach]
      summary: Record a progress value for a goal with metric `custom` (e.g. a timed run)
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalCheckInInput'}
      responses:
        '201':
          description: Updated goal including the new check-in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Goal'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/updates:
    get:
      tags: [Members]
      operationId: listMemberUpdates
      x-roles: [owner, coach, customer]
      summary: Change feed for a member (coach changed a plan, set a goal, session booked or cancelled)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of updates, newest first, with the unread count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberUpdatePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/updates/read:
    post:
      tags: [Members]
      operationId: markMemberUpdatesRead
      x-roles: [customer]
      summary: Mark updates as read up to a timestamp (customer, self or child only)
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: {type: string, format: date-time}
      responses:
        '204': {description: Marked read}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sessions/{sessionId}:
    get:
      tags: [Sessions]
      operationId: getSession
      x-roles: [owner, coach, customer]
      summary: Session detail. Owner and coach get the roster; customer gets only their own booking and attendance plus counts.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Sessions]
      operationId: updateSession
      x-roles: [owner, coach]
      summary: Reschedule, cancel or add a coach note. Coach only own sessions.
      description: |
        Cancelling sets status cancelled and cancels all bookings, writing a
        `session_cancelled` update per booked or waitlisted member. Rescheduling writes
        `session_rescheduled`. A completed session can only change `coachNote`.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionPatch'}
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/attendance:
    put:
      tags: [Sessions]
      operationId: recordAttendance
      x-roles: [owner, coach]
      summary: One-tap roll call. Upserts attendance rows (idempotent by clientId) and optionally completes the session.
      description: |
        Coach only own sessions. Members must be on the roster (enrolled in the batch
        on the session date, or holding a booking). `reason` required when status is
        excused, forbidden otherwise. Last write wins on `markedAt`. Offline clients
        replay the same body; the result is identical.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceInput'}
      responses:
        '200':
          description: Session with updated roster
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/bookings:
    post:
      tags: [Sessions]
      operationId: bookSession
      x-roles: [owner, coach, customer]
      summary: Book a member into a scheduled group-class session (waitlisted when full)
      description: |
        Customer only for self or child, and only sessions of batches the member is
        enrolled in. Coach only own sessions. 409 conflict when the session is not
        scheduled, already started, or the member already holds an active booking.
        When the session is full the booking is `waitlisted` with a position (or 409
        when the tenant disabled the waitlist).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: {type: string}
      responses:
        '201':
          description: Booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/cancel:
    post:
      tags: [Sessions]
      operationId: cancelBooking
      x-roles: [owner, coach, customer]
      summary: Cancel a booking. Customers only before the tenant's cancellation window closes.
      description: |
        Customer only own (or child's) booking, and only until startsAt minus
        bookingCancelWindowMinutes (409 conflict with details field `cancelWindow`
        after that). Owner and coach (own sessions) can cancel any time before start.
        Cancelling a booked place promotes the first waitlisted member and writes a
        `waitlist_promoted` update for them.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Cancelled booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /analytics/overview:
    get:
      tags: [Analytics]
      operationId: getOwnerOverview
      x-roles: [owner]
      summary: Owner KPIs for a period (members, attendance, sessions, engagement, workouts, retention)
      description: Formulas in docs/PLAN-POC.md "Owner analytics". Default period is the last 30 days ending today.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerOverview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/trends:
    get:
      tags: [Analytics]
      operationId: getOwnerTrends
      x-roles: [owner]
      summary: Weekly or monthly series for charts (attendance, sessions, members, workouts)
      parameters:
        - name: granularity
          in: query
          schema: {type: string, enum: [week, month], default: week}
        - name: periods
          in: query
          description: Number of buckets ending with the current one
          schema: {type: integer, minimum: 2, maximum: 24, default: 12}
      responses:
        '200':
          description: Trends
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerTrends'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/coaches:
    get:
      tags: [Analytics]
      operationId: getCoachWorkload
      x-roles: [owner]
      summary: Per-coach performance and workload for a period
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Coach workload
          content:
            application/json:
              schema:
                type: object
                required: [from, to, items]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CoachStats'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/fees:
    get:
      tags: [Analytics]
      operationId: getFeeStats
      x-roles: [owner]
      summary: Fee status counts (display only; no amounts, no payment processing)
      responses:
        '200':
          description: Fee stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeeStats'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/insights:
    get:
      tags: [Analytics]
      operationId: getOwnerInsights
      x-roles: [owner]
      summary: Follow-up flags, renewal alerts with recent attendance, unlogged sessions and rule-based insight cards
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerInsights'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /holidays:
    get:
      tags: [Holidays]
      operationId: listHolidays
      x-roles: [owner]
      summary: List the tenant's holiday and closure days (sessions on these dates are not counted as missed)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of holidays, oldest date first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HolidayPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Holidays]
      operationId: createHoliday
      x-roles: [owner]
      summary: Add a holiday or closure day (one per calendar date)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayInput'}
      responses:
        '201':
          description: Created holiday
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Holiday'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /holidays/{holidayId}:
    delete:
      tags: [Holidays]
      operationId: deleteHoliday
      x-roles: [owner]
      summary: Remove a holiday or closure day
      parameters:
        - name: holidayId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/excused-absences:
    get:
      tags: [Members]
      operationId: listExcusedAbsences
      x-roles: [owner, coach, customer]
      summary: Absences a member or parent declared ahead of time (active, not yet past by default)
      description: |
        Own view only (customer: self or children, coach: members in own batches). `status=all`
        also returns withdrawn and past declarations.
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: status, in: query, schema: {type: string, enum: [active, all]}}
      responses:
        '200':
          description: Declared absences, soonest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ExcusedAbsence'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Members]
      operationId: createExcusedAbsence
      x-roles: [customer]
      summary: Tell the coach ahead of time that a session or a date range will be missed
      description: |
        Customer only, for self or a child. Give either `sessionId` (one upcoming session of a
        batch the member is enrolled in) or `fromDate` (and optionally `toDate`, at most 60 days,
        not in the past). On the coach's roll call the member shows as excused with this reason;
        an excused absence does not extend the member's timeline. 409 conflict when the same
        absence is already declared or the session has started.
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExcusedAbsenceInput'}
      responses:
        '201':
          description: Declared absence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExcusedAbsence'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /excused-absences/{absenceId}/cancel:
    post:
      tags: [Members]
      operationId: cancelExcusedAbsence
      x-roles: [customer]
      summary: Withdraw a declared absence (safe to repeat)
      parameters:
        - name: absenceId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Withdrawn declaration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExcusedAbsence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/progress-card:
    get:
      tags: [Members]
      operationId: getProgressCard
      x-roles: [owner, coach, customer]
      summary: The weekly progress card (attendance, level, goals, streak, coach note)
      description: |
        Own view only. Positive progress framing: attended sessions and excused absences, no
        missed-class count. The card carries a first name only (no surname, photo, phone or
        guardian name); full names inside the coach note and goal titles are scrubbed. `week` is
        the Monday that starts the week (default: this week).
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: week, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Progress card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressCard'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/progress-card/note:
    get:
      tags: [Members]
      operationId: getProgressNote
      x-roles: [owner, coach]
      summary: The coach note for a week, as written (for editing)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: week, in: query, schema: {type: string, format: date}}
      responses:
        '200':
          description: Note (null when none)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressNote'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Members]
      operationId: saveProgressNote
      x-roles: [owner, coach]
      summary: Write, replace or (empty text) remove the coach note for a week
      description: Owner, or the coach of the member. At most 280 characters. Shown on the parent's card and on shared links.
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgressNoteInput'}
      responses:
        '200':
          description: Saved note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressNote'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/progress-card/links:
    get:
      tags: [Members]
      operationId: listProgressCardLinks
      x-roles: [owner, coach, customer]
      summary: Live shared links of a member's card (never includes a token)
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Active links, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProgressCardLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Members]
      operationId: createProgressCardLink
      x-roles: [owner, coach, customer]
      summary: Create an unguessable link to the card for a week
      description: |
        The response carries the token once (only its hash is stored). `path` is same-origin
        (`/card/{token}`); the browser prefixes its own origin. The link works without sign-in,
        expires after 30 days and can be revoked. At most 10 live links per member (409).
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                week: {type: string, format: date, description: Monday of the week; default this week}
      responses:
        '201':
          description: Link and its one-time token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedProgressCardLink'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /progress-card-links/{linkId}/revoke:
    post:
      tags: [Members]
      operationId: revokeProgressCardLink
      x-roles: [owner, coach, customer]
      summary: Stop a shared link from working (safe to repeat)
      parameters:
        - name: linkId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revoked link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressCardLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /progress-cards/{token}:
    get:
      tags: [Members]
      operationId: getSharedProgressCard
      x-roles: [public]
      security: []
      summary: Public weekly card behind an unguessable token
      description: |
        No sign-in; the token is the only credential. Unknown, malformed, revoked and expired
        tokens are all the same 404. Same first-name-only card as getProgressCard; never cached.
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Progress card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressCard'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workout-sets:
    put:
      tags: [Workouts]
      operationId: recordWorkoutSets
      x-roles: [coach, customer]
      summary: Log the sets of one assigned item for one date (idempotent batch upsert by set clientId)
      description: |
        Customer only for self or child; coach only for members in own batches (same rules as
        `recordWorkoutLog`). Creates the workout log for (assignmentId, planItemId, scheduledFor)
        when it does not exist yet (status started); an existing log keeps its status unless
        `complete` is true. `clientId` (log) and every set `clientId` are generated on the device
        so offline retries converge: a repeated set updates the stored one, a set `clientId`
        already stored on another log is 409. The log's `actualSets`, `actualReps` and
        `actualDurationSeconds` are derived from its sets (warm-up sets are not counted). 409 when
        the log is skipped. The response carries every set of the log and the records this
        log broke (`newBests`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutSetsInput'}
      responses:
        '200':
          description: The log with all its sets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutLogWithSets'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /members/{memberId}/workout-sets:
    get:
      tags: [Members]
      operationId: listWorkoutSets
      x-roles: [owner, coach, customer]
      summary: Logged sets of a member, newest day first (filter by log, exercise or dates)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: logId, in: query, schema: {type: string}}
        - {name: exerciseId, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of sets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutSetPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/exercises/{exerciseId}/history:
    get:
      tags: [Members]
      operationId: getExerciseHistory
      x-roles: [owner, coach, customer]
      summary: One exercise for one member over time - sessions with sets, a series per metric and records
      description: |
        `range` is 3m (default), 1y or all and limits `sessions`, `series` and `newBests`.
        `records` always cover the whole history (a best is a best). Warm-up sets never count.
        Estimated one-rep max uses the Epley formula. See docs/WORKOUT-ENGINE-CONTRACT.md.
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/ExerciseId'
        - {name: range, in: query, schema: {type: string, enum: ['3m', '1y', all], default: '3m'}}
      responses:
        '200':
          description: History
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExerciseHistory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sessions/{sessionId}/workout:
    get:
      tags: [Sessions]
      operationId: getSessionWorkout
      x-roles: [owner, coach, customer]
      summary: The class workout attached to a session (blocks ready to render), or null
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Class workout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionWorkout'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Sessions]
      operationId: attachSessionWorkout
      x-roles: [owner, coach]
      summary: Attach a plan day as the class workout of a session (planDayId null detaches)
      description: |
        The plan must be one the caller can see and not archived; the day needs at least one
        exercise. 409 for a cancelled session. When the roll call is completed and a workout is
        attached, the after-class summary is published automatically (see `recordAttendance`).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionWorkoutInput'}
      responses:
        '200':
          description: Class workout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionWorkout'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/summary:
    get:
      tags: [Sessions]
      operationId: getClassSummary
      x-roles: [owner, coach, customer]
      summary: The published after-class summary of a session
      description: |
        Customers must pass `memberId` (self or child; 400 otherwise) and get the summary as that
        member sees it (`forMember`: status plus message keys and params to translate). Owner and
        coach may omit `memberId` and then also get attendance `counts`. 404 until a summary is
        published, or when the member was not marked in that class. Never contains another
        member's name.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - {name: memberId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Sessions]
      operationId: publishClassSummary
      x-roles: [owner, coach]
      summary: Publish (or update) the after-class summary and tell the members
      description: |
        Allowed once the class has started or is completed (409 before, and for a cancelled
        session). Snapshots the attached class workout. Writes one member update per marked
        member who was not told yet: present `class_summary`, absent `class_catchup`, excused
        `class_catchup_excused` (softer wording). Repeating it updates the text and never tells a
        member twice. Finishing the roll call does this automatically when a workout is attached.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassSummaryInput'}
      responses:
        '200':
          description: Published summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /sessions/{sessionId}/summary/shares:
    post:
      tags: [Sessions]
      operationId: createClassSummaryShare
      x-roles: [owner, coach, customer]
      summary: Create a shareable link (30 days) to one member's view of a class summary
      description: |
        Only the hash of the token is stored. The link opens a page that calls `getSharedClassSummary`.
        Customers only for self or child.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClassSummaryShareInput'}
      responses:
        '201':
          description: Share link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSummaryShare'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /public/class-summaries/{token}:
    get:
      tags: [Sessions]
      operationId: getSharedClassSummary
      x-roles: [public]
      security: []
      summary: Public view of one member's class summary through a share link
      description: |
        No sign-in. Unknown, revoked and expired tokens are all 404. First name only, no ids of
        members or sessions. Responses carry `X-Robots-Tag: noindex, nofollow` and
        `Cache-Control: no-store`; the page that shows it must also set a noindex robots meta.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Shared summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedClassSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/class-summaries:
    get:
      tags: [Members]
      operationId: getMemberClassSummaries
      x-roles: [owner, coach, customer]
      summary: Class summaries a member was part of, newest class first
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of summaries, each with `forMember` set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassSummaryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /skill-checklists:
    get:
      tags: [Members]
      operationId: listSkillChecklists
      x-roles: [owner, coach, customer]
      summary: Belt and skill checklists of the tenant, in order
      parameters:
        - {name: sportId, in: query, schema: {type: string}}
        - {name: levelId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Checklists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillChecklistList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members/{memberId}/skill-progress:
    get:
      tags: [Members]
      operationId: getMemberSkillProgress
      x-roles: [owner, coach, customer]
      summary: A member's skills per checklist with sign-offs, counts and the next belt
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: sportId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberSkillProgress'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{memberId}/skill-sign-offs/{skillItemId}:
    put:
      tags: [Members]
      operationId: signOffSkill
      x-roles: [owner, coach]
      summary: Sign a skill off with a 1-4 rating (replaces an earlier sign-off)
      description: Coach only for members in own batches.
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: skillItemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillSignOffInput'}
      responses:
        '200':
          description: Sign-off
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillSignOff'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Members]
      operationId: clearSkillSignOff
      x-roles: [owner, coach]
      summary: Clear a skill sign-off (204 also when there was none)
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - {name: skillItemId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /plan-assignments/bulk:
    post:
      tags: [Workouts]
      operationId: sendPlanToMembers
      x-roles: [owner, coach]
      summary: Send a plan to several members in one call (idempotent on plan, member and start date)
      description: |
        One transaction, one `plan_assigned` update per member. Per member: `sent`,
        `already_sent` (same plan, member and startsOn: nothing changes) or `skipped_active`
        (the plan is still active for the member from another start date). An unknown plan or
        member is 404, a plan or member outside the caller's own view is 403, and then nothing is
        written. `repeat` decides when the assignment ends; which weekdays or days of the month
        are used comes from the plan's own days.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkSendInput'}
      responses:
        '200':
          description: Per-member result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkSendResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workout-plans/{planId}/results:
    get:
      tags: [Workouts]
      operationId: getPlanResults
      x-roles: [owner, coach]
      summary: What every member logged on a plan - items, sets, notes and new bests (one call)
      description: Date range defaults to the last 28 days, at most 92 days. Owner, or the coach who owns the plan.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - {name: memberId, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Results per assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanResults'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /analytics/classes:
    get:
      tags: [Analytics]
      operationId: getClassInsights
      x-roles: [owner]
      summary: Class slots - fill, attendance, waitlist, quiet slots, workouts sent - with plain suggestions
      description: |
        Positive, visibility-only framing: no coach is named or ranked. `range` is 7d, 28d (default) or 90d.
        Suggestions are message keys plus params for the UI to translate.
      parameters:
        - {name: range, in: query, schema: {type: string, enum: [7d, 28d, 90d], default: 28d}}
      responses:
        '200':
          description: Insights
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassInsights'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema: {type: string, example: karate-academy}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: {type: string}
    CoachId:
      name: coachId
      in: path
      required: true
      description: User id of a user with role coach
      schema: {type: string}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {type: string}
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {type: string}
    GoalId:
      name: goalId
      in: path
      required: true
      schema: {type: string}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string}
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: {type: string}
    From:
      name: from
      in: query
      description: Inclusive start date (YYYY-MM-DD, tenant timezone)
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      description: Inclusive end date (YYYY-MM-DD, tenant timezone)
      schema: {type: string, format: date}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Role not allowed or resource outside the caller's own view
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found (also returned for resources in another tenant)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The request conflicts with the current state (version mismatch, full, window closed, duplicate)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code
              example: validation_failed
              enum: [validation_failed, unauthorized, forbidden, not_found, conflict, rate_limited, payload_too_large, internal_error]
            message:
              type: string
              description: Human-readable, English
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string}
                  message: {type: string}
            requestId: {type: string}
    Role:
      type: string
      enum: [owner, coach, customer]
    Locale:
      type: string
      enum: [en, hi, kn]
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      example: '#1F6FEB'
    OtpRequest:
      type: object
      required: [tenantSlug, phone]
      properties:
        tenantSlug: {type: string}
        phone: {type: string, description: 'E.164, e.g. +919000000001'}
    OtpRequested:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: {type: integer, example: 300}
    OtpVerify:
      type: object
      required: [tenantSlug, phone, code]
      properties:
        tenantSlug: {type: string}
        phone: {type: string}
        code: {type: string, example: '123456'}
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresInSeconds: {type: integer}
    SignInResult:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/Me'}
    Me:
      type: object
      required: [id, role, name, tenantId, tenantSlug]
      properties:
        id: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        name: {type: string}
        phone: {type: string}
        tenantId: {type: string}
        tenantSlug: {type: string}
        memberIds:
          type: array
          description: For customers, the member profiles they may view (self and linked children)
          items: {type: string}
        coachId:
          type: string
          nullable: true
        locale: {$ref: '#/components/schemas/Locale'}
    TenantTheme:
      type: object
      required: [tenantSlug, displayName, primaryColor, secondaryColor]
      properties:
        tenantSlug: {type: string}
        displayName: {type: string, example: Demo Karate Academy}
        logoUrl: {type: string, format: uri, nullable: true}
        primaryColor: {$ref: '#/components/schemas/HexColor'}
        secondaryColor: {$ref: '#/components/schemas/HexColor'}
        accentColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true}
        defaultLocale: {$ref: '#/components/schemas/Locale'}
        warnings:
          type: array
          description: Only present on the PUT /tenant/theme response. Non-blocking advice, e.g. low contrast of white text on a color (below 4.5:1).
          items:
            type: object
            required: [field, code, message]
            properties:
              field: {type: string, example: primaryColor}
              code: {type: string, enum: [low_contrast]}
              message: {type: string}
    TenantThemeInput:
      type: object
      required: [displayName, primaryColor, secondaryColor]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        logoUrl: {type: string, format: uri, nullable: true}
        primaryColor: {$ref: '#/components/schemas/HexColor'}
        secondaryColor: {$ref: '#/components/schemas/HexColor'}
        accentColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true}
        defaultLocale: {$ref: '#/components/schemas/Locale'}
    Tenant:
      type: object
      required: [id, slug, theme, timezone]
      properties:
        id: {type: string}
        slug: {type: string}
        timezone: {type: string, example: Asia/Kolkata}
        theme: {$ref: '#/components/schemas/TenantTheme'}
        showMissedSessionCost:
          type: boolean
          default: false
          description: Per-tenant display toggle, off by default
        bookingCancelWindowMinutes:
          type: integer
          default: 120
          description: Customers may cancel a booking until this many minutes before the session starts
        waitlistEnabled:
          type: boolean
          default: true
    MemberStatus:
      type: string
      enum: [active, paused, ended]
    FeeStatus:
      type: string
      description: Display only; marked by hand
      enum: [paid, due, overdue]
    MemberSummary:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string}
        name: {type: string}
        status: {$ref: '#/components/schemas/MemberStatus'}
        batchIds:
          type: array
          items: {type: string}
        sportId: {type: string, nullable: true}
        level: {type: string, nullable: true, example: Yellow belt}
        feeStatus: {$ref: '#/components/schemas/FeeStatus'}
        attendancePercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
    MemberSessionEntry:
      type: object
      required: [sessionId, date, attendance]
      properties:
        sessionId: {type: string}
        date: {type: string, format: date}
        attendance:
          type: string
          enum: [present, absent, excused, not_marked]
        excusedReason:
          type: string
          nullable: true
          enum: [exam, illness, festival, travel]
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          properties:
            phone: {type: string, nullable: true}
            guardianName: {type: string, nullable: true}
            joinDate: {type: string, format: date}
            goal: {type: string, nullable: true}
            progressPercent:
              type: number
              minimum: 0
              maximum: 100
              description: Level or belt progress; a missed class extends the timeline except excused absences and holidays
            attendance:
              type: object
              properties:
                attended: {type: integer}
                missed: {type: integer}
                excused: {type: integer}
                scheduled: {type: integer}
            recentSessions:
              type: array
              items: {$ref: '#/components/schemas/MemberSessionEntry'}
    MemberMagicLink:
      type: object
      additionalProperties: false
      required: [url, expiresAt, recipient]
      properties:
        url: {type: string, description: 'Shareable link, APP_BASE_URL + /auth/magic?token=...'}
        expiresAt: {type: string, format: date-time}
        recipient:
          type: string
          enum: [member, guardian]
          description: Whose login the link signs in (guardian for kids).
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MemberSummary'}
        nextCursor: {type: string, nullable: true}
    ImportResult:
      type: object
      required: [dryRun, totalRows, validRows, errors]
      properties:
        dryRun: {type: boolean}
        totalRows: {type: integer}
        validRows: {type: integer}
        importedRows:
          type: integer
          description: New members created. Present only when dryRun is false and import succeeded
        skippedRows:
          type: integer
          description: Rows that already exist in this tenant (name and contact phone) and were not imported again
        warnings:
          type: array
          description: Non-blocking notes, e.g. a batch name that does not exist yet. row 0 means a whole-file note.
          items:
            type: object
            required: [row, message]
            properties:
              row: {type: integer}
              column: {type: string, nullable: true}
              message: {type: string}
        preview:
          type: array
          description: First rows as parsed (max 20)
          items:
            type: object
            additionalProperties: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row: {type: integer, description: '1-based data row (header excluded)'}
              column: {type: string, nullable: true}
              message: {type: string}
    Batch:
      type: object
      required: [id, name, sportId, venueId, coachIds]
      properties:
        id: {type: string}
        name: {type: string, example: Evening beginners}
        sportId: {type: string}
        sportName: {type: string}
        venueId: {type: string}
        venueName: {type: string}
        coachIds:
          type: array
          items: {type: string}
        isGroupClass: {type: boolean}
        capacity: {type: integer, nullable: true}
        memberCount: {type: integer}
        schedule:
          type: array
          items:
            type: object
            required: [weekday, startTime, endTime]
            properties:
              weekday: {type: integer, minimum: 1, maximum: 7, description: '1 = Monday'}
              startTime: {type: string, example: '18:00'}
              endTime: {type: string, example: '19:00'}
    Venue:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string, example: Main hall}
        address: {type: string, nullable: true}
        city: {type: string, nullable: true}
        timezone: {type: string, example: Asia/Kolkata}
        batchCount: {type: integer}
    CoachCredential:
      type: object
      required: [id, coachId, title, issuer, year, verified, verifiedAt]
      properties:
        id: {type: string}
        coachId: {type: string}
        title: {type: string, minLength: 1, maxLength: 80}
        issuer: {type: string, nullable: true, maxLength: 80}
        year: {type: integer, nullable: true, minimum: 1970}
        verified: {type: boolean}
        verifiedAt: {type: string, format: date-time, nullable: true}
    CoachCredentialList:
      type: object
      required: [coachId, items]
      properties:
        coachId: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/CoachCredential'}
    CoachCredentialInput:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
        issuer: {type: string, nullable: true, maxLength: 80}
        year: {type: integer, nullable: true, minimum: 1970}
    CoachCredentialVerification:
      type: object
      required: [verified]
      properties:
        verified: {type: boolean}
    Holiday:
      type: object
      required: [id, date, name]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        name: {type: string, minLength: 1, maxLength: 80}
    HolidayInput:
      type: object
      required: [date, name]
      properties:
        date: {type: string, format: date}
        name: {type: string, minLength: 1, maxLength: 80}
    HolidayPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Holiday'}
        nextCursor: {type: string, nullable: true}
    VenuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Venue'}
        nextCursor: {type: string, nullable: true}
    BatchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
        nextCursor: {type: string, nullable: true}
    SessionStatus:
      type: string
      enum: [scheduled, completed, cancelled]
    Session:
      type: object
      required: [id, batchId, coachId, startsAt, endsAt, status]
      properties:
        id: {type: string}
        batchId: {type: string}
        batchName: {type: string}
        coachId: {type: string}
        coachName: {type: string}
        venueId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/SessionStatus'}
        attendanceSummary:
          type: object
          description: Present once roll call is logged
          nullable: true
          properties:
            present: {type: integer}
            absent: {type: integer}
            excused: {type: integer}
            total: {type: integer}
        coachNote: {type: string, nullable: true}
        kind:
          type: string
          enum: [group_class, one_on_one]
        capacity: {type: integer, nullable: true}
        bookedCount: {type: integer}
        waitlistCount: {type: integer}
        myBookingStatus:
          type: string
          nullable: true
          enum: [booked, waitlisted, cancelled]
          description: Customer only; status of the caller's (or child's) booking, when one exists
    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Session'}
        nextCursor: {type: string, nullable: true}
    # ---- Sprint 2 schemas -------------------------------------------------
    Percent:
      type: number
      minimum: 0
      maximum: 100
      nullable: true
      description: Rounded to one decimal; null when the denominator is 0
    TenantSettingsInput:
      type: object
      properties:
        bookingCancelWindowMinutes: {type: integer, minimum: 0, maximum: 2880}
        waitlistEnabled: {type: boolean}
        showMissedSessionCost: {type: boolean}
    Exercise:
      type: object
      required: [id, name, sportSlug, needsTrainerReview]
      properties:
        id: {type: string}
        name: {type: string}
        sportSlug: {type: string}
        category: {type: string, nullable: true}
        level: {type: string, nullable: true}
        equipment: {type: string, nullable: true}
        primaryMuscles: {type: array, items: {type: string}}
        secondaryMuscles: {type: array, items: {type: string}}
        instructions: {type: array, items: {type: string}}
        needsTrainerReview: {type: boolean}
        licence: {type: string}
        metricType: {$ref: '#/components/schemas/MetricType'}
    ExerciseSummary:
      type: object
      required: [id, name, sportSlug]
      properties:
        id: {type: string}
        name: {type: string}
        sportSlug: {type: string}
        equipment: {type: string, nullable: true}
        primaryMuscles: {type: array, items: {type: string}}
        needsTrainerReview: {type: boolean}
        metricType: {$ref: '#/components/schemas/MetricType'}
    ExercisePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ExerciseSummary'}
        nextCursor: {type: string, nullable: true}
    CoachSummary:
      type: object
      required: [id, name, batchCount, memberCount]
      properties:
        id: {type: string}
        name: {type: string}
        batchCount: {type: integer}
        memberCount: {type: integer}
        upcomingSessions7d: {type: integer}
        activeAssignments: {type: integer}
    CoachStats:
      type: object
      required: [coachId, coachName, from, to, sessions]
      properties:
        coachId: {type: string}
        coachName: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        batchCount: {type: integer}
        memberCount: {type: integer}
        sessions:
          type: object
          required: [scheduled, completed, cancelled, unlogged]
          properties:
            scheduled: {type: integer, description: Past non-cancelled sessions in the period}
            completed: {type: integer}
            cancelled: {type: integer}
            unlogged: {type: integer, description: Past sessions still `scheduled` more than 2 hours after endsAt}
            upcoming7d: {type: integer}
        consistencyPercent: {$ref: '#/components/schemas/Percent'}
        attendancePercent: {$ref: '#/components/schemas/Percent'}
        workoutAdherencePercent: {$ref: '#/components/schemas/Percent'}
        activeAssignments: {type: integer}
        activePlans: {type: integer}
        availabilityHoursPerWeek: {type: number}
        bookedHoursNext7d: {type: number}
        loadPercent:
          $ref: '#/components/schemas/Percent'
        memberOutcomes:
          type: object
          properties:
            goalsAchieved: {type: integer}
            goalsActive: {type: integer}
            levelPromotions: {type: integer}
        weekly:
          type: array
          description: Last 8 weeks, oldest first
          items:
            type: object
            required: [weekStart, scheduled, completed]
            properties:
              weekStart: {type: string, format: date}
              scheduled: {type: integer}
              completed: {type: integer}
              attendancePercent: {$ref: '#/components/schemas/Percent'}
    AvailabilitySlot:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        id: {type: string, readOnly: true}
        weekday: {type: integer, minimum: 1, maximum: 7, description: '1 = Monday'}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '06:00'}
        endTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00'}
        venueId: {type: string, nullable: true}
    CoachAvailability:
      type: object
      required: [coachId, slots]
      properties:
        coachId: {type: string}
        slots:
          type: array
          items: {$ref: '#/components/schemas/AvailabilitySlot'}
    CoachAvailabilityInput:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/AvailabilitySlot'}
    PlanCadence:
      type: string
      enum: [daily, weekly, monthly]
      description: |
        daily: one day (dayIndex 1) repeated every day. weekly: dayIndex 1-7 = ISO
        weekday. monthly: dayIndex 1-31 = day of month (29-31 skipped in shorter months).
    PlanStatus:
      type: string
      enum: [draft, active, archived]
    AssignmentStatus:
      type: string
      enum: [active, paused, ended]
    PlanItem:
      type: object
      required: [exerciseId, position]
      properties:
        id: {type: string, readOnly: true}
        exerciseId: {type: string}
        exerciseName: {type: string, readOnly: true}
        position: {type: integer, minimum: 1}
        sets: {type: integer, minimum: 1, maximum: 20, nullable: true}
        reps: {type: integer, minimum: 1, maximum: 200, nullable: true}
        durationSeconds: {type: integer, minimum: 1, maximum: 7200, nullable: true}
        restSeconds: {type: integer, minimum: 0, maximum: 900, nullable: true}
        metricType: {$ref: '#/components/schemas/MetricType'}
        supersetGroup: {type: string, maxLength: 4, nullable: true, description: 'Superset label such as A. A group needs 2+ items next to each other (by position) with the same rounds.'}
        rounds: {type: integer, minimum: 1, maximum: 20, nullable: true, description: Rounds of a superset (needs supersetGroup)}
        targetWeightKg: {type: number, minimum: 0, maximum: 1000, nullable: true}
        targetDistanceMeters: {type: integer, minimum: 1, maximum: 100000, nullable: true}
        notes: {type: string, maxLength: 280, nullable: true}
      description: At least one of reps, durationSeconds or targetDistanceMeters is required.
    PlanDay:
      type: object
      required: [dayIndex, items]
      properties:
        id: {type: string, readOnly: true}
        dayIndex: {type: integer, minimum: 1, maximum: 31}
        title: {type: string, maxLength: 80, nullable: true, example: Legs and core}
        notes: {type: string, maxLength: 500, nullable: true}
        items:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/PlanItem'}
        blocks:
          type: array
          readOnly: true
          description: The same items grouped for rendering (single exercises and supersets). Not sent on create or update.
          items: {$ref: '#/components/schemas/PlanBlock'}
    WorkoutPlanInput:
      type: object
      required: [title, cadence, days]
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 1000, nullable: true}
        cadence: {$ref: '#/components/schemas/PlanCadence'}
        sportSlug: {type: string, nullable: true}
        status:
          type: string
          enum: [draft, active]
          default: active
        days:
          type: array
          minItems: 1
          maxItems: 31
          items: {$ref: '#/components/schemas/PlanDay'}
    WorkoutPlan:
      type: object
      required: [id, title, cadence, status, version, coachId, days]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string, nullable: true}
        cadence: {$ref: '#/components/schemas/PlanCadence'}
        sportSlug: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/PlanStatus'}
        version: {type: integer}
        coachId: {type: string, description: Creator}
        coachName: {type: string}
        activeAssignmentCount: {type: integer}
        updatedAt: {type: string, format: date-time}
        days:
          type: array
          items: {$ref: '#/components/schemas/PlanDay'}
    WorkoutPlanSummary:
      type: object
      required: [id, title, cadence, status, version, coachId]
      properties:
        id: {type: string}
        title: {type: string}
        cadence: {$ref: '#/components/schemas/PlanCadence'}
        status: {$ref: '#/components/schemas/PlanStatus'}
        version: {type: integer}
        coachId: {type: string}
        coachName: {type: string}
        dayCount: {type: integer}
        itemCount: {type: integer}
        activeAssignmentCount: {type: integer}
        updatedAt: {type: string, format: date-time}
    WorkoutPlanPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkoutPlanSummary'}
        nextCursor: {type: string, nullable: true}
    PlanAssignmentInput:
      type: object
      required: [planId, memberIds, startsOn]
      properties:
        planId: {type: string}
        memberIds:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string}
        startsOn: {type: string, format: date}
        endsOn: {type: string, format: date, nullable: true}
        note: {type: string, maxLength: 280, nullable: true, description: Shown to the member in the update}
    PlanAssignmentPatch:
      type: object
      properties:
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        startsOn: {type: string, format: date}
        endsOn: {type: string, format: date, nullable: true}
        note: {type: string, maxLength: 280, nullable: true}
    PlanAssignment:
      type: object
      required: [id, planId, planTitle, memberId, status, startsOn]
      properties:
        id: {type: string}
        planId: {type: string}
        planTitle: {type: string}
        planVersion: {type: integer, description: Plan version at the last change the member saw}
        cadence: {$ref: '#/components/schemas/PlanCadence'}
        memberId: {type: string}
        memberName: {type: string}
        assignedById: {type: string}
        assignedByName: {type: string}
        status: {$ref: '#/components/schemas/AssignmentStatus'}
        startsOn: {type: string, format: date}
        endsOn: {type: string, format: date, nullable: true}
        note: {type: string, nullable: true}
        adherencePercent: {$ref: '#/components/schemas/Percent'}
        updatedAt: {type: string, format: date-time}
    PlanAssignmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanAssignment'}
        nextCursor: {type: string, nullable: true}
    WorkoutLogStatus:
      type: string
      enum: [started, stopped, completed, skipped]
    WorkoutLogInput:
      type: object
      required: [clientId, assignmentId, planItemId, scheduledFor, action]
      properties:
        clientId: {type: string, minLength: 8, maxLength: 64, description: Generated on the device (UUID)}
        assignmentId: {type: string}
        planItemId: {type: string}
        memberId: {type: string, description: Optional; must match the assignment's member}
        scheduledFor: {type: string, format: date}
        action:
          type: string
          enum: [start, stop, complete, skip]
        actualSets: {type: integer, minimum: 0, maximum: 50, nullable: true}
        actualReps: {type: integer, minimum: 0, maximum: 500, nullable: true}
        actualDurationSeconds: {type: integer, minimum: 0, maximum: 14400, nullable: true}
        note: {type: string, maxLength: 280, nullable: true}
        occurredAt: {type: string, format: date-time, description: Device time of the action (offline replay); defaults to server time}
    WorkoutLog:
      type: object
      required: [id, assignmentId, planItemId, memberId, scheduledFor, status]
      properties:
        id: {type: string}
        clientId: {type: string}
        assignmentId: {type: string}
        planId: {type: string}
        planTitle: {type: string}
        planItemId: {type: string}
        exerciseId: {type: string}
        exerciseName: {type: string}
        memberId: {type: string}
        scheduledFor: {type: string, format: date}
        status: {$ref: '#/components/schemas/WorkoutLogStatus'}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        actualSets: {type: integer, nullable: true}
        actualReps: {type: integer, nullable: true}
        actualDurationSeconds: {type: integer, nullable: true}
        note: {type: string, nullable: true}
        recordedById: {type: string}
    WorkoutLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkoutLog'}
        nextCursor: {type: string, nullable: true}
    ScheduledItem:
      type: object
      required: [assignmentId, planItemId, exerciseId, exerciseName, status]
      properties:
        assignmentId: {type: string}
        planId: {type: string}
        planTitle: {type: string}
        planItemId: {type: string}
        exerciseId: {type: string}
        exerciseName: {type: string}
        position: {type: integer}
        sets: {type: integer, nullable: true}
        reps: {type: integer, nullable: true}
        durationSeconds: {type: integer, nullable: true}
        restSeconds: {type: integer, nullable: true}
        notes: {type: string, nullable: true}
        metricType: {$ref: '#/components/schemas/MetricType'}
        supersetGroup: {type: string, nullable: true}
        rounds: {type: integer, nullable: true}
        targetWeightKg: {type: number, nullable: true}
        targetDistanceMeters: {type: integer, nullable: true}
        status:
          type: string
          enum: [pending, started, stopped, completed, skipped]
          description: pending = no log yet
        logId: {type: string, nullable: true}
    ScheduleDay:
      type: object
      required: [date, items, sessions]
      properties:
        date: {type: string, format: date}
        isHoliday: {type: boolean}
        holidayName: {type: string, nullable: true}
        dayTitle: {type: string, nullable: true}
        items:
          type: array
          items: {$ref: '#/components/schemas/ScheduledItem'}
        blocks:
          type: array
          description: The same items grouped for rendering. A superset only groups items of the same assignment.
          items: {$ref: '#/components/schemas/ScheduledBlock'}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/Session'}
    MemberSchedule:
      type: object
      required: [memberId, from, to, days]
      properties:
        memberId: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        unreadUpdates: {type: integer}
        days:
          type: array
          items: {$ref: '#/components/schemas/ScheduleDay'}
    MemberStats:
      type: object
      required: [memberId, from, to, attendance, workouts]
      properties:
        memberId: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        attendance:
          type: object
          required: [attended, missed, excused]
          properties:
            attended: {type: integer}
            missed: {type: integer}
            excused: {type: integer}
            percent: {$ref: '#/components/schemas/Percent'}
            hoursAttended: {type: number, description: Sum of session durations attended (supports the hourly achievement option)}
        workouts:
          type: object
          required: [scheduled, completed, pending, skipped]
          properties:
            scheduled: {type: integer, description: Expanded items scheduled on dates from..min(to, today)}
            completed: {type: integer}
            pending: {type: integer}
            skipped: {type: integer}
            adherencePercent: {$ref: '#/components/schemas/Percent'}
            upcoming: {type: integer, description: Items scheduled after today up to `to`}
        streaks:
          type: object
          description: Daily streak data (supports the daily-streak achievement option)
          properties:
            currentActiveDays: {type: integer}
            longestActiveDays: {type: integer}
        level:
          type: object
          nullable: true
          properties:
            name: {type: string}
            rank: {type: integer}
            nextName: {type: string, nullable: true}
            progressPercent: {$ref: '#/components/schemas/Percent'}
        goals:
          type: object
          properties:
            active: {type: integer}
            achieved: {type: integer}
        weekly:
          type: array
          description: Weekly buckets from..to, oldest first
          items:
            type: object
            required: [weekStart]
            properties:
              weekStart: {type: string, format: date}
              attended: {type: integer}
              missed: {type: integer}
              workoutsCompleted: {type: integer}
              workoutsScheduled: {type: integer}
    GoalStatus:
      type: string
      enum: [active, achieved, dropped]
    GoalMetric:
      type: string
      enum: [sessions_attended, workouts_completed, level, custom]
    GoalInput:
      type: object
      required: [title, metric]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        metric: {$ref: '#/components/schemas/GoalMetric'}
        targetValue: {type: number, minimum: 0, nullable: true, description: Required for sessions_attended, workouts_completed and custom}
        startValue: {type: number, nullable: true, description: custom only; baseline}
        unit: {type: string, maxLength: 20, nullable: true, example: km}
        targetLevelId: {type: string, nullable: true, description: Required for level}
        targetDate: {type: string, format: date, nullable: true}
        startsOn: {type: string, format: date, nullable: true, description: Counting starts here; defaults to today}
    GoalPatch:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        targetValue: {type: number, minimum: 0, nullable: true}
        unit: {type: string, maxLength: 20, nullable: true}
        targetDate: {type: string, format: date, nullable: true}
        status: {$ref: '#/components/schemas/GoalStatus'}
    GoalCheckInInput:
      type: object
      required: [value]
      properties:
        value: {type: number}
        note: {type: string, maxLength: 280, nullable: true}
        recordedOn: {type: string, format: date, nullable: true}
    Goal:
      type: object
      required: [id, memberId, title, metric, status, progressPercent]
      properties:
        id: {type: string}
        memberId: {type: string}
        title: {type: string}
        metric: {$ref: '#/components/schemas/GoalMetric'}
        status: {$ref: '#/components/schemas/GoalStatus'}
        targetValue: {type: number, nullable: true}
        startValue: {type: number, nullable: true}
        currentValue: {type: number, nullable: true}
        unit: {type: string, nullable: true}
        targetLevelId: {type: string, nullable: true}
        targetLevelName: {type: string, nullable: true}
        targetDate: {type: string, format: date, nullable: true}
        startsOn: {type: string, format: date}
        progressPercent: {type: number, minimum: 0, maximum: 100}
        createdById: {type: string, nullable: true}
        createdByName: {type: string, nullable: true}
        checkIns:
          type: array
          description: custom metric only, newest first, max 20
          items:
            type: object
            required: [id, value, recordedOn]
            properties:
              id: {type: string}
              value: {type: number}
              note: {type: string, nullable: true}
              recordedOn: {type: string, format: date}
        updatedAt: {type: string, format: date-time}
    MemberUpdateKind:
      type: string
      enum: [plan_assigned, plan_updated, plan_ended, goal_set, goal_updated, session_scheduled, session_rescheduled, session_cancelled, booking_confirmed, waitlist_promoted, class_summary, class_catchup, class_catchup_excused]
    MemberUpdate:
      type: object
      required: [id, memberId, kind, createdAt, read]
      properties:
        id: {type: string}
        memberId: {type: string}
        kind: {$ref: '#/components/schemas/MemberUpdateKind'}
        entityType:
          type: string
          enum: [plan, assignment, goal, session, booking, class_summary]
        entityId: {type: string}
        actorName: {type: string, nullable: true}
        title: {type: string, description: Short English fallback; UI renders from kind + params via i18n}
        params:
          type: object
          additionalProperties: {type: string}
        createdAt: {type: string, format: date-time}
        read: {type: boolean}
    MemberUpdatePage:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MemberUpdate'}
        unreadCount: {type: integer}
        nextCursor: {type: string, nullable: true}
    SessionInput:
      type: object
      required: [startsAt, endsAt]
      properties:
        batchId: {type: string, nullable: true, description: Either batchId or memberId}
        memberId: {type: string, nullable: true, description: One-on-one session with this member}
        coachId: {type: string, nullable: true, description: Owner only; forced to self for coaches}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        capacity: {type: integer, minimum: 1, maximum: 500, nullable: true, description: Overrides the batch capacity for this session}
        title: {type: string, maxLength: 80, nullable: true}
        clientId: {type: string, nullable: true}
    SessionPatch:
      type: object
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status:
          type: string
          enum: [cancelled]
        cancelReason: {type: string, maxLength: 200, nullable: true}
        coachNote: {type: string, maxLength: 1000, nullable: true}
        capacity: {type: integer, minimum: 1, maximum: 500, nullable: true}
    BookingStatus:
      type: string
      enum: [booked, waitlisted, cancelled]
    Booking:
      type: object
      required: [id, sessionId, memberId, status]
      properties:
        id: {type: string}
        sessionId: {type: string}
        memberId: {type: string}
        memberName: {type: string}
        status: {$ref: '#/components/schemas/BookingStatus'}
        waitlistPosition: {type: integer, nullable: true}
        createdAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time, nullable: true}
        cancellableUntil: {type: string, format: date-time, nullable: true, description: For customers; startsAt minus the tenant cancellation window}
    ExcusedAbsenceInput:
      type: object
      properties:
        sessionId: {type: string, description: One upcoming session. Do not combine with dates.}
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date, description: Defaults to fromDate; at most 60 days after it}
        reason: {type: string, enum: [exam, illness, festival, travel]}
        note: {type: string, maxLength: 280}
      required: [reason]
    ProgressCard:
      type: object
      required: [firstName, tenantName, weekStart, weekEnd, level, attendance, streak, goals, coachNote]
      properties:
        firstName: {type: string, description: First name only}
        tenantName: {type: string}
        weekStart: {type: string, format: date}
        weekEnd: {type: string, format: date}
        level:
          type: object
          nullable: true
          required: [name, nextName, progressPercent]
          properties:
            name: {type: string}
            nextName: {type: string, nullable: true}
            progressPercent: {type: number, nullable: true}
        attendance:
          type: object
          required: [attended, held, excused, percent]
          properties:
            attended: {type: integer}
            held: {type: integer, description: Counted sessions held this week (attended plus excused plus not attended)}
            excused: {type: integer}
            percent: {type: number, nullable: true}
        streak:
          type: object
          required: [currentDays, longestDays]
          properties:
            currentDays: {type: integer}
            longestDays: {type: integer}
        goals:
          type: array
          items:
            type: object
            required: [title, progressPercent, achieved]
            properties:
              title: {type: string}
              progressPercent: {type: number}
              achieved: {type: boolean}
        coachNote: {type: string, nullable: true}
    ProgressNoteInput:
      type: object
      required: [note]
      properties:
        week: {type: string, format: date, description: Monday of the week; default this week}
        note: {type: string, maxLength: 280, description: Empty removes the note}
    ProgressNote:
      type: object
      required: [memberId, weekStart, note, updatedAt]
      properties:
        memberId: {type: string}
        weekStart: {type: string, format: date}
        note: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time, nullable: true}
    ProgressCardLink:
      type: object
      required: [id, memberId, weekStart, status, expiresAt, createdAt]
      properties:
        id: {type: string}
        memberId: {type: string}
        weekStart: {type: string, format: date}
        status: {type: string, enum: [active, revoked, expired]}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    CreatedProgressCardLink:
      allOf:
        - $ref: '#/components/schemas/ProgressCardLink'
        - type: object
          required: [token, path]
          properties:
            token: {type: string}
            path: {type: string, description: Same-origin path (card, then the token)}
    ExcusedAbsence:
      type: object
      required: [id, memberId, fromDate, toDate, reason, status]
      properties:
        id: {type: string}
        memberId: {type: string}
        memberName: {type: string}
        sessionId: {type: string, nullable: true}
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
        reason: {type: string, enum: [exam, illness, festival, travel]}
        note: {type: string, nullable: true}
        status: {type: string, enum: [active, withdrawn]}
        createdAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time, nullable: true}
    RosterEntry:
      type: object
      required: [memberId, memberName, source, attendance]
      properties:
        memberId: {type: string}
        memberName: {type: string}
        source:
          type: string
          enum: [enrolled, booked, waitlisted]
        bookingId: {type: string, nullable: true}
        attendance:
          type: string
          enum: [present, absent, excused, not_marked]
        excusedReason:
          type: string
          nullable: true
          enum: [exam, illness, festival, travel]
        note: {type: string, nullable: true}
        attendanceClientId: {type: string, nullable: true}
        preMarked: {type: boolean, description: True when excused is shown only because the member or parent declared the absence ahead of time (nothing marked yet)}
        declaredReason:
          type: string
          nullable: true
          enum: [exam, illness, festival, travel]
        declaredNote: {type: string, nullable: true}
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            kind:
              type: string
              enum: [group_class, one_on_one]
            title: {type: string, nullable: true}
            venueName: {type: string}
            capacity: {type: integer, nullable: true}
            bookedCount: {type: integer}
            waitlistCount: {type: integer}
            isHoliday: {type: boolean}
            cancelReason: {type: string, nullable: true}
            warnings:
              type: array
              description: Non-blocking notes on create/update, e.g. outside_availability
              items:
                type: object
                required: [code, message]
                properties:
                  code: {type: string, enum: [outside_availability, over_capacity, on_holiday]}
                  message: {type: string}
            roster:
              type: array
              description: Owner and coach only. Omitted for customers.
              items: {$ref: '#/components/schemas/RosterEntry'}
            myBookings:
              type: array
              description: Customer only; bookings of self or children for this session
              items: {$ref: '#/components/schemas/Booking'}
            myAttendance:
              type: array
              description: Customer only
              items:
                type: object
                properties:
                  memberId: {type: string}
                  attendance: {type: string, enum: [present, absent, excused, not_marked]}
    AttendanceInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [memberId, status, clientId]
            properties:
              memberId: {type: string}
              status:
                type: string
                enum: [present, absent, excused]
              reason:
                type: string
                nullable: true
                enum: [exam, illness, festival, travel]
              note: {type: string, maxLength: 280, nullable: true}
              clientId: {type: string, minLength: 8, maxLength: 64}
              markedAt: {type: string, format: date-time, nullable: true, description: Device time; used for last-write-wins}
        complete: {type: boolean, default: false, description: Also set the session to completed}
        coachNote: {type: string, maxLength: 1000, nullable: true}
        sessionClientId: {type: string, nullable: true}
    KpiValue:
      type: object
      required: [value]
      properties:
        value: {type: number, nullable: true}
        previous: {type: number, nullable: true, description: Same-length period immediately before}
        changePercent: {type: number, nullable: true}
    OwnerOverview:
      type: object
      required: [from, to, members, sessions, attendance, engagement, workouts, retention]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        members:
          type: object
          required: [active, new, left]
          properties:
            active: {$ref: '#/components/schemas/KpiValue'}
            new: {$ref: '#/components/schemas/KpiValue'}
            left: {$ref: '#/components/schemas/KpiValue'}
            netGrowthPercent: {$ref: '#/components/schemas/KpiValue'}
        sessions:
          type: object
          required: [scheduled, completed]
          properties:
            scheduled: {$ref: '#/components/schemas/KpiValue'}
            completed: {$ref: '#/components/schemas/KpiValue'}
            cancelled: {$ref: '#/components/schemas/KpiValue'}
            unlogged: {$ref: '#/components/schemas/KpiValue'}
            completionPercent: {$ref: '#/components/schemas/KpiValue'}
        attendance:
          type: object
          required: [percent]
          properties:
            percent: {$ref: '#/components/schemas/KpiValue'}
            noShowPercent: {$ref: '#/components/schemas/KpiValue'}
            byWeekday:
              type: array
              description: ISO weekday 1-7
              items:
                type: object
                required: [weekday, sessions]
                properties:
                  weekday: {type: integer}
                  percent: {$ref: '#/components/schemas/Percent'}
                  noShowPercent: {$ref: '#/components/schemas/Percent'}
                  sessions: {type: integer, description: Completed non-holiday sessions on that weekday in the period}
            byBatch:
              type: array
              description: No-show pattern per batch (completed non-holiday sessions in the period), sorted by batch name
              items:
                type: object
                required: [batchId, batchName, sessions]
                properties:
                  batchId: {type: string}
                  batchName: {type: string}
                  sessions: {type: integer}
                  percent: {$ref: '#/components/schemas/Percent'}
                  noShowPercent: {$ref: '#/components/schemas/Percent'}
        engagement:
          type: object
          required: [engagedMembers, percent]
          properties:
            engagedMembers: {$ref: '#/components/schemas/KpiValue'}
            percent: {$ref: '#/components/schemas/KpiValue'}
        workouts:
          type: object
          required: [scheduled, completed]
          properties:
            scheduled: {$ref: '#/components/schemas/KpiValue'}
            completed: {$ref: '#/components/schemas/KpiValue'}
            adherencePercent: {$ref: '#/components/schemas/KpiValue'}
            activeAssignments: {$ref: '#/components/schemas/KpiValue'}
            membersWithPlan: {$ref: '#/components/schemas/KpiValue'}
        retention:
          type: object
          required: [percent]
          properties:
            percent: {$ref: '#/components/schemas/KpiValue'}
            cohorts:
              type: array
              description: Last 6 join months, oldest first
              items:
                type: object
                required: [month, joined]
                properties:
                  month: {type: string, example: '2026-06'}
                  joined: {type: integer}
                  retained30: {$ref: '#/components/schemas/Percent'}
                  retained60: {$ref: '#/components/schemas/Percent'}
                  retained90: {$ref: '#/components/schemas/Percent'}
        bookings:
          type: object
          properties:
            booked: {type: integer}
            waitlisted: {type: integer}
            cancelled: {type: integer}
            fillPercent: {$ref: '#/components/schemas/Percent'}
    TrendPoint:
      type: object
      required: [periodStart]
      properties:
        periodStart: {type: string, format: date}
        activeMembers: {type: integer}
        newMembers: {type: integer}
        leftMembers: {type: integer}
        sessionsScheduled: {type: integer}
        sessionsCompleted: {type: integer}
        attendancePercent: {$ref: '#/components/schemas/Percent'}
        workoutsCompleted: {type: integer}
        workoutsScheduled: {type: integer}
        engagedMembers: {type: integer}
    OwnerTrends:
      type: object
      required: [granularity, points]
      properties:
        granularity: {type: string, enum: [week, month]}
        points:
          type: array
          items: {$ref: '#/components/schemas/TrendPoint'}
    FeeStats:
      type: object
      required: [asOf, counts, activeMembers]
      description: Counts only. No amounts are stored or shown; payments processing is out of scope.
      properties:
        asOf: {type: string, format: date}
        activeMembers: {type: integer}
        counts:
          type: object
          required: [paid, due, overdue, waived]
          properties:
            paid: {type: integer}
            due: {type: integer}
            overdue: {type: integer}
            waived: {type: integer}
        dueNext7Days: {type: integer}
        paidThisMonth: {type: integer}
        paidByMethod:
          type: object
          properties:
            cash: {type: integer}
            upi: {type: integer}
            unknown: {type: integer}
        paidPercent: {$ref: '#/components/schemas/Percent'}
    OwnerInsights:
      type: object
      required: [generatedAt, followUps, renewals, unloggedSessions, cards]
      properties:
        generatedAt: {type: string, format: date-time}
        followUps:
          type: array
          description: Members who may need a friendly check-in
          items:
            type: object
            required: [memberId, memberName, reason]
            properties:
              memberId: {type: string}
              memberName: {type: string}
              reason: {type: string, enum: [consecutive_absences, inactive_14_days, workouts_pending]}
              detail: {type: integer, description: e.g. number of consecutive absences or days inactive}
              coachName: {type: string, nullable: true}
        renewals:
          type: array
          description: Fee overdue or due within 7 days, with recent attendance
          items:
            type: object
            required: [memberId, memberName, feeStatus]
            properties:
              memberId: {type: string}
              memberName: {type: string}
              feeStatus: {type: string, enum: [due, overdue]}
              feeDueOn: {type: string, format: date, nullable: true}
              attendancePercent30d: {$ref: '#/components/schemas/Percent'}
        unloggedSessions:
          type: array
          description: Past sessions with no roll call logged 2 hours after they ended (owner alert)
          items:
            type: object
            required: [sessionId, batchName, coachName, startsAt]
            properties:
              sessionId: {type: string}
              batchName: {type: string}
              coachName: {type: string}
              startsAt: {type: string, format: date-time}
              isGroupClass: {type: boolean}
        cards:
          type: array
          description: Rule-based insight cards (see docs/PLAN-POC.md). Positive framing.
          items:
            type: object
            required: [code, tone, title]
            properties:
              code: {type: string}
              tone: {type: string, enum: [positive, neutral, attention]}
              title: {type: string}
              params:
                type: object
                additionalProperties: {type: string}
    MetricType:
      type: string
      enum: [WEIGHT_REPS, REPS, TIME, DISTANCE_TIME, SCORE, CHECKLIST]
      description: |
        What is logged per set. WEIGHT_REPS (kg and reps: gym), REPS (karate kihon, yoga), TIME (seconds: drills,
        holds), DISTANCE_TIME (metres and seconds: swimming, running), SCORE (made out of attempts), CHECKLIST (coach rating 1-4).
    SetType:
      type: string
      enum: [normal, warmup, drop, failure]
    PlanBlock:
      type: object
      required: [type, label, rounds, items]
      description: A single exercise, or a superset (2+ items done back to back for `rounds` rounds). Render blocks as they come.
      properties:
        type: {type: string, enum: [single, superset]}
        label: {type: string, nullable: true, description: Superset label such as A; null for a single}
        rounds: {type: integer, nullable: true}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}
    ScheduledBlock:
      type: object
      required: [type, label, rounds, items]
      properties:
        type: {type: string, enum: [single, superset]}
        label: {type: string, nullable: true}
        rounds: {type: integer, nullable: true}
        items:
          type: array
          items: {$ref: '#/components/schemas/ScheduledItem'}
    WorkoutSetInput:
      type: object
      required: [clientId, setNumber]
      description: Give at least one of weightKg, reps, seconds, meters, scoreMade with scoreOf, rating.
      properties:
        clientId: {type: string, minLength: 8, maxLength: 64, description: Generated on the device (UUID)}
        setNumber: {type: integer, minimum: 1, maximum: 200}
        setType: {$ref: '#/components/schemas/SetType'}
        weightKg: {type: number, minimum: 0, maximum: 1000, nullable: true}
        reps: {type: integer, minimum: 0, maximum: 1000, nullable: true}
        seconds: {type: integer, minimum: 0, maximum: 86400, nullable: true}
        meters: {type: integer, minimum: 0, maximum: 100000, nullable: true}
        scoreMade: {type: integer, minimum: 0, nullable: true}
        scoreOf: {type: integer, minimum: 1, nullable: true}
        rating: {type: integer, minimum: 1, maximum: 4, nullable: true}
        completedAt: {type: string, format: date-time, description: Device time of the set (offline replay); defaults to server time}
    WorkoutSetsInput:
      type: object
      required: [clientId, assignmentId, planItemId, scheduledFor, sets]
      properties:
        clientId: {type: string, minLength: 8, maxLength: 64, description: Client id of the log (used when the log is created)}
        assignmentId: {type: string}
        planItemId: {type: string}
        memberId: {type: string, description: Optional; must match the assignment's member}
        scheduledFor: {type: string, format: date}
        note: {type: string, maxLength: 280, nullable: true, description: The member's note on this item and day}
        complete: {type: boolean, description: Mark the item completed}
        sets:
          type: array
          minItems: 1
          maxItems: 60
          items: {$ref: '#/components/schemas/WorkoutSetInput'}
    WorkoutSet:
      type: object
      required: [id, logId, clientId, setNumber, setType, completedAt]
      properties:
        id: {type: string}
        logId: {type: string}
        clientId: {type: string}
        setNumber: {type: integer}
        setType: {$ref: '#/components/schemas/SetType'}
        weightKg: {type: number, nullable: true}
        reps: {type: integer, nullable: true}
        seconds: {type: integer, nullable: true}
        meters: {type: integer, nullable: true}
        scoreMade: {type: integer, nullable: true}
        scoreOf: {type: integer, nullable: true}
        rating: {type: integer, nullable: true}
        completedAt: {type: string, format: date-time}
    WorkoutSetListItem:
      allOf:
        - $ref: '#/components/schemas/WorkoutSet'
        - type: object
          required: [scheduledFor, exerciseId, exerciseName]
          properties:
            scheduledFor: {type: string, format: date}
            exerciseId: {type: string}
            exerciseName: {type: string}
    WorkoutSetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkoutSetListItem'}
        nextCursor: {type: string, nullable: true}
    BestKind:
      type: string
      enum: [heaviest_weight, one_rep_max, best_set_volume, session_volume, most_reps, longest_time, best_split, best_score]
    NewBest:
      type: object
      required: [metric, value, previous]
      properties:
        metric: {$ref: '#/components/schemas/BestKind'}
        value: {type: number}
        previous: {type: number, description: The best before this session}
    NewBestOnDate:
      allOf:
        - $ref: '#/components/schemas/NewBest'
        - type: object
          required: [logId, date]
          properties:
            logId: {type: string}
            date: {type: string, format: date}
    WorkoutLogWithSets:
      allOf:
        - $ref: '#/components/schemas/WorkoutLog'
        - type: object
          required: [sets, newBests]
          properties:
            sets:
              type: array
              items: {$ref: '#/components/schemas/WorkoutSet'}
            newBests:
              type: array
              items: {$ref: '#/components/schemas/NewBest'}
    SeriesPoint:
      type: object
      required: [date, value]
      properties:
        date: {type: string, format: date}
        value: {type: number}
    ExerciseSeries:
      type: object
      description: One point per session, oldest first. Empty when the metric has no data. bestScore is a percent; bestSplit is seconds per 100 m (lower is better).
      required: [heaviestWeight, oneRepMax, bestSetVolume, sessionVolume, totalReps, bestTime, bestSplit, bestScore]
      properties:
        heaviestWeight: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        oneRepMax: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        bestSetVolume: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        sessionVolume: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        totalReps: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        bestTime: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        bestSplit: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
        bestScore: {type: array, items: {$ref: '#/components/schemas/SeriesPoint'}}
    RecordValue:
      type: object
      required: [value, date]
      properties:
        value: {type: number}
        date: {type: string, format: date}
    RepRecord:
      type: object
      required: [reps, weightKg, date]
      properties:
        reps: {type: integer}
        weightKg: {type: number}
        date: {type: string, format: date}
    ExerciseRecords:
      type: object
      required: [heaviestWeight, oneRepMax, bestSetVolume, bestSessionVolume, mostReps, longestTime, bestSplit, bestScore, weightAtReps]
      properties:
        heaviestWeight: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        oneRepMax: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        bestSetVolume: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        bestSessionVolume: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        mostReps: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        longestTime: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        bestSplit: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        bestScore: {nullable: true, allOf: [{$ref: '#/components/schemas/RecordValue'}]}
        weightAtReps:
          type: array
          description: Heaviest weight at each rep count, ascending by reps
          items: {$ref: '#/components/schemas/RepRecord'}
    ExerciseHistorySession:
      type: object
      required: [logId, date, status, sets]
      properties:
        logId: {type: string}
        date: {type: string, format: date}
        status: {$ref: '#/components/schemas/WorkoutLogStatus'}
        note: {type: string, nullable: true}
        sets:
          type: array
          items: {$ref: '#/components/schemas/WorkoutSet'}
    ExerciseHistory:
      type: object
      required: [memberId, exerciseId, exerciseName, metricType, range, from, sessions, series, records, newBests]
      properties:
        memberId: {type: string}
        exerciseId: {type: string}
        exerciseName: {type: string}
        metricType: {$ref: '#/components/schemas/MetricType'}
        range: {type: string, enum: ['3m', '1y', all]}
        from: {type: string, format: date, nullable: true, description: First date included; null for all}
        sessions:
          type: array
          description: Newest first
          items: {$ref: '#/components/schemas/ExerciseHistorySession'}
        series: {$ref: '#/components/schemas/ExerciseSeries'}
        records: {$ref: '#/components/schemas/ExerciseRecords'}
        newBests:
          type: array
          items: {$ref: '#/components/schemas/NewBestOnDate'}
    ClassWorkoutItem:
      type: object
      required: [id, exerciseId, exerciseName, metricType, position]
      properties:
        id: {type: string}
        exerciseId: {type: string}
        exerciseName: {type: string}
        metricType: {$ref: '#/components/schemas/MetricType'}
        position: {type: integer}
        sets: {type: integer, nullable: true}
        reps: {type: integer, nullable: true}
        durationSeconds: {type: integer, nullable: true}
        restSeconds: {type: integer, nullable: true}
        supersetGroup: {type: string, nullable: true}
        rounds: {type: integer, nullable: true}
        targetWeightKg: {type: number, nullable: true}
        targetDistanceMeters: {type: integer, nullable: true}
        notes: {type: string, nullable: true}
    ClassWorkoutBlock:
      type: object
      required: [type, label, rounds, items]
      properties:
        type: {type: string, enum: [single, superset]}
        label: {type: string, nullable: true}
        rounds: {type: integer, nullable: true}
        items:
          type: array
          items: {$ref: '#/components/schemas/ClassWorkoutItem'}
    ClassWorkout:
      type: object
      required: [planId, planTitle, dayTitle, blocks]
      properties:
        planId: {type: string}
        planTitle: {type: string}
        dayTitle: {type: string, nullable: true}
        blocks:
          type: array
          items: {$ref: '#/components/schemas/ClassWorkoutBlock'}
    SessionWorkoutInput:
      type: object
      required: [planDayId]
      properties:
        planDayId: {type: string, nullable: true, description: A plan day id, or null to detach}
    SessionWorkout:
      type: object
      required: [sessionId, planDayId, workout]
      properties:
        sessionId: {type: string}
        planDayId: {type: string, nullable: true}
        workout: {nullable: true, allOf: [{$ref: '#/components/schemas/ClassWorkout'}]}
    ClassSummaryInput:
      type: object
      properties:
        coachNote: {type: string, maxLength: 1000, nullable: true, description: Defaults to the session's coach note on the first publish}
        homePractice: {type: string, maxLength: 1000, nullable: true}
    ClassSummaryMemberView:
      type: object
      required: [memberId, status, titleKey, bodyKey, params]
      description: Message keys (see lib/i18n/messages/en/workout-engine.ts) and params to translate. params.firstName is the member's own first name.
      properties:
        memberId: {type: string}
        status: {type: string, enum: [present, absent, excused]}
        titleKey: {type: string, example: cs.present.title}
        bodyKey: {type: string, example: cs.present.body}
        params:
          type: object
          additionalProperties: {type: string}
    ClassSummary:
      type: object
      required: [id, sessionId, batchName, startsAt, endsAt, coachNote, homePractice, publishedAt, workout, counts, forMember]
      properties:
        id: {type: string}
        sessionId: {type: string}
        batchName: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        coachNote: {type: string, nullable: true}
        homePractice: {type: string, nullable: true}
        publishedAt: {type: string, format: date-time}
        workout: {nullable: true, allOf: [{$ref: '#/components/schemas/ClassWorkout'}], description: Frozen when the summary was published}
        counts:
          nullable: true
          type: object
          description: Owner and coach only (null for customers)
          required: [present, absent, excused]
          properties:
            present: {type: integer}
            absent: {type: integer}
            excused: {type: integer}
        forMember: {nullable: true, allOf: [{$ref: '#/components/schemas/ClassSummaryMemberView'}]}
    ClassSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ClassSummary'}
        nextCursor: {type: string, nullable: true}
    ClassSummaryShareInput:
      type: object
      required: [memberId]
      properties:
        memberId: {type: string}
    ClassSummaryShare:
      type: object
      required: [url, expiresAt]
      properties:
        url: {type: string, description: 'APP_BASE_URL + /share/class/{token}'}
        expiresAt: {type: string, format: date-time}
    SharedClassSummary:
      type: object
      required: [tenantName, tenantSlug, firstName, batchName, startsAt, endsAt, status, titleKey, bodyKey, params, coachNote, homePractice, workout, expiresAt]
      properties:
        tenantName: {type: string}
        tenantSlug: {type: string, description: Use with getTenantTheme to brand the page}
        firstName: {type: string}
        batchName: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [present, absent, excused]}
        titleKey: {type: string}
        bodyKey: {type: string}
        params:
          type: object
          additionalProperties: {type: string}
        coachNote: {type: string, nullable: true}
        homePractice: {type: string, nullable: true}
        workout: {nullable: true, allOf: [{$ref: '#/components/schemas/ClassWorkout'}]}
        expiresAt: {type: string, format: date-time}
    SkillChecklistItem:
      type: object
      required: [id, title, description, sortOrder]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string, nullable: true}
        sortOrder: {type: integer}
    SkillChecklist:
      type: object
      required: [id, sportId, sportSlug, sportName, levelId, levelName, levelRank, levelColorHex, title, sortOrder, items]
      properties:
        id: {type: string}
        sportId: {type: string}
        sportSlug: {type: string}
        sportName: {type: string}
        levelId: {type: string, nullable: true, description: The belt or level this checklist leads to; null for a free-standing list}
        levelName: {type: string, nullable: true}
        levelRank: {type: integer, nullable: true}
        levelColorHex: {type: string, nullable: true}
        title: {type: string}
        sortOrder: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/SkillChecklistItem'}
    SkillChecklistList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SkillChecklist'}
    MemberSkillItem:
      type: object
      required: [skillItemId, title, description, sortOrder, signedOff, rating, note, signedOffAt, signedOffByName]
      properties:
        skillItemId: {type: string}
        title: {type: string}
        description: {type: string, nullable: true}
        sortOrder: {type: integer}
        signedOff: {type: boolean}
        rating: {type: integer, minimum: 1, maximum: 4, nullable: true}
        note: {type: string, nullable: true}
        signedOffAt: {type: string, format: date-time, nullable: true}
        signedOffByName: {type: string, nullable: true}
    MemberSkillChecklist:
      type: object
      required: [checklistId, sportId, sportName, levelId, levelName, levelRank, levelColorHex, title, isNextLevel, doneCount, totalCount, percent, complete, items]
      properties:
        checklistId: {type: string}
        sportId: {type: string}
        sportName: {type: string}
        levelId: {type: string, nullable: true}
        levelName: {type: string, nullable: true}
        levelRank: {type: integer, nullable: true}
        levelColorHex: {type: string, nullable: true}
        title: {type: string}
        isNextLevel: {type: boolean, description: This checklist leads to the member's next belt}
        doneCount: {type: integer}
        totalCount: {type: integer}
        percent: {type: integer, minimum: 0, maximum: 100}
        complete: {type: boolean, description: Every skill signed off}
        items:
          type: array
          items: {$ref: '#/components/schemas/MemberSkillItem'}
    MemberSkillProgress:
      type: object
      required: [memberId, currentLevels, checklists]
      properties:
        memberId: {type: string}
        currentLevels:
          type: array
          items:
            type: object
            required: [sportId, levelId, levelName, rank, achievedOn]
            properties:
              sportId: {type: string}
              levelId: {type: string}
              levelName: {type: string}
              rank: {type: integer}
              achievedOn: {type: string, format: date}
        checklists:
          type: array
          items: {$ref: '#/components/schemas/MemberSkillChecklist'}
    SkillSignOffInput:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 4}
        note: {type: string, maxLength: 280, nullable: true}
    SkillSignOff:
      type: object
      required: [memberId, skillItemId, rating, note, signedOffAt, signedOffById, signedOffByName]
      properties:
        memberId: {type: string}
        skillItemId: {type: string}
        rating: {type: integer}
        note: {type: string, nullable: true}
        signedOffAt: {type: string, format: date-time}
        signedOffById: {type: string, nullable: true}
        signedOffByName: {type: string, nullable: true}
    BulkSendInput:
      type: object
      required: [planId, memberIds, startsOn]
      properties:
        planId: {type: string}
        memberIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
        startsOn: {type: string, format: date}
        repeat:
          type: object
          description: When the assignment ends. Default ongoing.
          required: [mode]
          properties:
            mode: {type: string, enum: [ongoing, once, weeks, until]}
            weeks: {type: integer, minimum: 1, maximum: 52, description: For mode weeks}
            endsOn: {type: string, format: date, description: For mode until}
        note: {type: string, maxLength: 280, nullable: true, description: Shown to every member in the update}
    BulkSendResult:
      type: object
      required: [planId, planTitle, startsOn, endsOn, results, sentCount, alreadySentCount, skippedCount]
      properties:
        planId: {type: string}
        planTitle: {type: string}
        startsOn: {type: string, format: date}
        endsOn: {type: string, format: date, nullable: true}
        results:
          type: array
          items:
            type: object
            required: [memberId, memberName, status, assignmentId]
            properties:
              memberId: {type: string}
              memberName: {type: string}
              status: {type: string, enum: [sent, already_sent, skipped_active]}
              assignmentId: {type: string}
        sentCount: {type: integer}
        alreadySentCount: {type: integer}
        skippedCount: {type: integer}
    PlanResultItem:
      type: object
      required: [logId, planItemId, exerciseId, exerciseName, metricType, status, note, actualSets, actualReps, actualDurationSeconds, sets, newBests]
      properties:
        logId: {type: string}
        planItemId: {type: string}
        exerciseId: {type: string}
        exerciseName: {type: string}
        metricType: {$ref: '#/components/schemas/MetricType'}
        status: {$ref: '#/components/schemas/WorkoutLogStatus'}
        note: {type: string, nullable: true, description: The member's note}
        actualSets: {type: integer, nullable: true}
        actualReps: {type: integer, nullable: true}
        actualDurationSeconds: {type: integer, nullable: true}
        sets:
          type: array
          items: {$ref: '#/components/schemas/WorkoutSet'}
        newBests:
          type: array
          items: {$ref: '#/components/schemas/NewBest'}
    PlanResults:
      type: object
      required: [planId, from, to, items]
      properties:
        planId: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        items:
          type: array
          items:
            type: object
            required: [assignmentId, memberId, memberName, status, startsOn, endsOn, note, itemsCompleted, itemsSkipped, daysLogged, setCount, newBestCount, days]
            properties:
              assignmentId: {type: string}
              memberId: {type: string}
              memberName: {type: string}
              status: {$ref: '#/components/schemas/AssignmentStatus'}
              startsOn: {type: string, format: date}
              endsOn: {type: string, format: date, nullable: true}
              note: {type: string, nullable: true}
              itemsCompleted: {type: integer}
              itemsSkipped: {type: integer}
              daysLogged: {type: integer}
              setCount: {type: integer}
              newBestCount: {type: integer}
              days:
                type: array
                description: Newest first
                items:
                  type: object
                  required: [date, items]
                  properties:
                    date: {type: string, format: date}
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/PlanResultItem'}
    ClassInsights:
      type: object
      required: [range, from, to, overall, slots, suggestions]
      properties:
        range: {type: string, enum: [7d, 28d, 90d]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        overall:
          type: object
          required: [classesHeld, avgFillRate, attendanceRate, workoutSentShare]
          properties:
            classesHeld: {type: integer}
            avgFillRate: {$ref: '#/components/schemas/Percent'}
            attendanceRate: {$ref: '#/components/schemas/Percent'}
            workoutSentShare: {$ref: '#/components/schemas/Percent'}
        slots:
          type: array
          items:
            type: object
            required: [batchId, batchName, sportId, sportName, daysOfWeek, startTime, endTime, capacity, sessionCount, avgFillRate, attendanceRate, workoutSentShare, waitlistCount, quietSlot]
            properties:
              batchId: {type: string}
              batchName: {type: string}
              sportId: {type: string}
              sportName: {type: string}
              daysOfWeek: {type: array, items: {type: integer}}
              startTime: {type: string}
              endTime: {type: string}
              capacity: {type: integer, nullable: true}
              sessionCount: {type: integer, description: Classes held (roll call completed) in the range}
              avgFillRate: {$ref: '#/components/schemas/Percent'}
              attendanceRate: {$ref: '#/components/schemas/Percent'}
              workoutSentShare: {$ref: '#/components/schemas/Percent'}
              waitlistCount: {type: integer, description: People currently waitlisted for upcoming classes of this slot}
              quietSlot: {type: boolean, description: 'Room to grow: at least 3 classes held and average fill under 40 percent'}
        suggestions:
          type: array
          items:
            type: object
            required: [kind, messageKey, batchId, params]
            properties:
              kind: {type: string, enum: [add_class, move_slot]}
              messageKey: {type: string, enum: [ci.addClass, ci.moveSlot]}
              batchId: {type: string}
              params:
                type: object
                additionalProperties: true
